[project]
name = "public-meeting-transcript-archive"
version = "0.1.0"
description = "A backend API for creating transcripts for public meetings using AWS transcribe and and AWS Compose for subject and speaker recognition"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "faker>=25.0"
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23"
]


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meeting_transcript*"]
