services:
  # optional local postgres; the agent itself runs with agentcore dev, not in docker
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: transcript_archive
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # can tell if the database is actually running or not
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db-data:
