<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Meeting Transcript Archive{% endblock %}</title>
<style>
  /* The chatbot page's theme (chat/templates/chat/index.html), which the Vue frontend uses too */
  :root {
    --bg: #f5f3ee; --panel: #ffffff; --text: #1c2230; --muted: #5f6878; --border: #e1ddd3;
    --mast: #1d2a44; --mast-text: #f4f1ea; --mast-muted: #b9c1d3; --gold: #c9a24a;
    --accent: #1f5f8b; --accent-hover: #174a6d; --accent-text: #ffffff; --accent-soft: #e6eef5;
    --error: #b42318; --error-bg: #fef3f2;
    --shadow: 0 1px 2px rgba(28, 34, 48, .06), 0 4px 14px rgba(28, 34, 48, .06);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151c; --panel: #1a1f29; --text: #e7e9ee; --muted: #9aa3b2; --border: #2b3240;
      --mast: #0c1220; --mast-text: #eef0f4; --mast-muted: #8e99ad; --gold: #d8b45e;
      --accent: #6fa8d6; --accent-hover: #8dbce2; --accent-text: #0b1420; --accent-soft: #1d2c3c;
      --error: #fda29b; --error-bg: #3a1a17;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); }

  /* masthead, the same as the Vue frontend's (frontend/src/App.vue) */
  .masthead { background: var(--mast); color: var(--mast-text); border-bottom: 3px solid var(--gold); }
  .masthead .inner {
    max-width: 1040px; margin: 0 auto; padding: 16px 16px 14px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px;
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; color: inherit; text-decoration: none; }
  .seal { width: 40px; height: 40px; flex: none; color: var(--gold); }
  .titles { display: flex; flex-direction: column; min-width: 0; }
  .name { font: 600 22px/1.2 var(--serif); letter-spacing: .2px; }
  .tagline { color: var(--mast-muted); font-size: 13px; margin-top: 2px; }
  .masthead nav { display: flex; align-items: center; gap: 18px; }
  .masthead nav a { color: var(--mast-text); text-decoration: none; font-size: 14px; }
  .masthead nav a:hover { text-decoration: underline; }
  .masthead nav form { margin: 0; }
  .masthead .sign-in, .masthead nav button {
    font: inherit; font-size: 14px; color: var(--mast-text); background: transparent; cursor: pointer;
    padding: 6px 14px; border: 1px solid rgba(255, 255, 255, .28); border-radius: 8px;
  }
  .masthead .sign-in:hover, .masthead nav button:hover { text-decoration: none; background: rgba(255, 255, 255, .08); }

  /* the page's own content, in a card */
  main { max-width: 480px; margin: 48px auto; padding: 0 16px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 28px; }
  h1 { font: 600 26px/1.2 var(--serif); margin: 0 0 8px; }
  .quiet { color: var(--muted); font-size: 14px; }
  .error { color: var(--error); background: var(--error-bg); border-radius: 8px; padding: 8px 12px; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 14px; }
  input[type=text], input[type=password] {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; min-height: 44px;
  }
  main button {
    margin-top: 20px; font: inherit; font-weight: 600; cursor: pointer; min-height: 44px; padding: 0 18px;
    background: var(--accent); color: var(--accent-text); border: 1px solid var(--accent); border-radius: 8px;
  }
  main button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 560px) {
    .tagline { display: none; }
    .name { font-size: 18px; }
    main { margin-top: 28px; }
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="inner">
    <a href="/" class="brand">
      <svg class="seal" viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 15 L20 6 L35 15 Z" stroke-linejoin="round"/>
        <path d="M9 18v12M16 18v12M24 18v12M31 18v12" stroke-linecap="round"/>
        <path d="M5 33h30" stroke-linecap="round"/>
      </svg>
      <span class="titles">
        <span class="name">Meeting Transcript Archive</span>
        <span class="tagline">What your councils, boards and commissions said, on the record.</span>
      </span>
    </a>
    <nav>
      <a href="{% url 'chat' %}">Ask the archive</a>
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>
      {% elif request.resolver_match.url_name != "login" %}
        <a href="{% url 'login' %}" class="sign-in">Sign in</a>
      {% endif %}
    </nav>
  </div>
</header>
<main>
<div class="panel">
{% block content %}{% endblock %}
</div>
</main>
</body>
</html>
