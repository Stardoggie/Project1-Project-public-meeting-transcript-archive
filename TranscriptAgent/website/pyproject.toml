[project]
name = "website"
version = "0.1.0"
description = "The archive's website: the clerks' admin, the chatbot for signed-in viewers and the public read-only API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django~=5.2.0",
    "whitenoise~=6.9",
    "gunicorn~=23.0",
    "public-meeting-transcript-archive"
]

[tool.uv]
package = false

[tool.uv.sources]
public-meeting-transcript-archive = { path = "../../public_meeting_transcript_archive" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django~=4.11"
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
